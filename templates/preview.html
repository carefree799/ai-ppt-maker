<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>预览大纲 - AI PPT Maker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>确认大纲</h1>
    <p><strong>主题：</strong>{{ topic }}</p>

    {% if description %}
    <p><strong>补充说明：</strong>{{ description }}</p>
    {% endif %}

    <h2>大纲内容（共 {{ outline.slides|length }} 页）</h2>
    {% for slide in outline.slides %}
    <div class="slide-preview">
      <strong>第 {{ slide.page }} 页：{{ slide.title }}</strong>
    </div>
    {% endfor %}

    <form method="post" action="/create">
      <input type="hidden" name="session_id" value="{{ session_id }}">
      <button type="submit">确认并生成 PPT</button>
    </form>
    <p><a href="/">重新输入</a></p>
  </div>
</body>
</html>
